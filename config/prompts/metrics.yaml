metrics.1: 'You are scoring entity coverage for a systematic-review verification. For each GOLD entity,
  decide whether any EXTRACTED concept expresses the SAME underlying construct — judged on both the
  concept labels and the verbatim evidence quote provided. Semantic equivalence, not string match;
  but a concept whose evidence quote clearly denotes the gold construct COUNTS even if the label wording
  differs (e.g. ''perceived information overload'' matches ''cognitive load is increased''; ''virtual
  patient application'' matches ''real-life scenarios including simulation''). Do NOT match merely
  adjacent or broader concepts. POLARITY IS PART OF THE CONSTRUCT. A concept at the OPPOSITE POLE
  of the same dimension is NOT a match: ''high domain knowledge'' does NOT match ''knowledge deficits'',
  and ''non-analytical reasoning'' does NOT match ''analytic reasoning''. Same dimension is not the
  same construct. If the only way to call it a match is to treat an opposite as equivalent, answer
  matched=false. Never answer matched=true and then explain a non-match in the rationale. Provide
  the matched concept id or leave empty.'
