<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<rect width="900" height="700" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<g font-size="14">
<rect x="40" y="24" width="330" height="56" rx="8" fill="#fdf1dc" stroke="#b9792a" stroke-width="0.8"/>
<text x="205" y="46" text-anchor="middle" font-weight="600" fill="#6b4410">Initial programme theory</text>
<text x="205" y="66" text-anchor="middle" font-size="12.5" fill="#8a6220">the theory to be tested</text>
<rect x="500" y="24" width="360" height="56" rx="8" fill="#fbeae6" stroke="#b05a3c" stroke-width="0.8"/>
<text x="680" y="46" text-anchor="middle" font-weight="600" fill="#7a3620">HITL-0 · ratify</text>
<text x="680" y="66" text-anchor="middle" font-size="12.5" fill="#99523a">before it steers anything</text>
<line x1="372" y1="52" x2="496" y2="52" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="205" y1="82" x2="205" y2="116" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="120" width="330" height="56" rx="8" fill="#eeedfd" stroke="#6f66c9" stroke-width="0.8"/>
<text x="205" y="142" text-anchor="middle" font-weight="600" fill="#3c3489">Ingest</text>
<text x="205" y="162" text-anchor="middle" font-size="12.5" fill="#534ab7">28 papers, 165 text units</text>
<line x1="205" y1="178" x2="205" y2="212" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="216" width="330" height="56" rx="8" fill="#eeedfd" stroke="#6f66c9" stroke-width="0.8"/>
<text x="205" y="238" text-anchor="middle" font-weight="600" fill="#3c3489">Screen</text>
<text x="205" y="258" text-anchor="middle" font-size="12.5" fill="#534ab7">two models vote, 86 decisions</text>
<rect x="500" y="216" width="360" height="56" rx="8" fill="#fbeae6" stroke="#b05a3c" stroke-width="0.8"/>
<text x="680" y="238" text-anchor="middle" font-weight="600" fill="#7a3620">HITL-1 · adjudicate</text>
<text x="680" y="258" text-anchor="middle" font-size="12.5" fill="#99523a">only where they disagree</text>
<line x1="372" y1="244" x2="496" y2="244" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="205" y1="274" x2="205" y2="308" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="312" width="330" height="56" rx="8" fill="#eeedfd" stroke="#6f66c9" stroke-width="0.8"/>
<text x="205" y="334" text-anchor="middle" font-weight="600" fill="#3c3489">Extract</text>
<text x="205" y="354" text-anchor="middle" font-size="12.5" fill="#534ab7">94 CMOCs, 547 quoted elements</text>
<rect x="500" y="312" width="360" height="56" rx="8" fill="#fbeae6" stroke="#b05a3c" stroke-width="0.8"/>
<text x="680" y="334" text-anchor="middle" font-weight="600" fill="#7a3620">HITL-2 · validate</text>
<text x="680" y="354" text-anchor="middle" font-size="12.5" fill="#99523a">weak or flagged configurations</text>
<line x1="372" y1="340" x2="496" y2="340" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="205" y1="370" x2="205" y2="404" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="408" width="330" height="56" rx="8" fill="#eeedfd" stroke="#6f66c9" stroke-width="0.8"/>
<text x="205" y="430" text-anchor="middle" font-weight="600" fill="#3c3489">Synthesise across studies</text>
<text x="205" y="450" text-anchor="middle" font-size="12.5" fill="#534ab7">547 mentions to 183 concepts</text>
<rect x="500" y="408" width="360" height="56" rx="8" fill="#fbeae6" stroke="#b05a3c" stroke-width="0.8"/>
<text x="680" y="430" text-anchor="middle" font-weight="600" fill="#7a3620">HITL-3 · resolve</text>
<text x="680" y="450" text-anchor="middle" font-size="12.5" fill="#99523a">20 contradictions found</text>
<line x1="372" y1="436" x2="496" y2="436" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="205" y1="466" x2="205" y2="500" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="504" width="330" height="56" rx="8" fill="#eeedfd" stroke="#6f66c9" stroke-width="0.8"/>
<text x="205" y="526" text-anchor="middle" font-weight="600" fill="#3c3489">Find emergent mechanisms</text>
<text x="205" y="546" text-anchor="middle" font-size="12.5" fill="#534ab7">8 communities, bottom-up</text>
<line x1="205" y1="562" x2="205" y2="596" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="40" y="600" width="330" height="56" rx="8" fill="#e3f4ee" stroke="#2f8a6a" stroke-width="0.8"/>
<text x="205" y="622" text-anchor="middle" font-weight="600" fill="#0f6e56">Programme theory</text>
<text x="205" y="642" text-anchor="middle" font-size="12.5" fill="#1d9e75">what works, for whom, why</text>
<rect x="500" y="600" width="360" height="56" rx="8" fill="#fbeae6" stroke="#b05a3c" stroke-width="0.8"/>
<text x="680" y="622" text-anchor="middle" font-weight="600" fill="#7a3620">HITL-4 · sign off</text>
<text x="680" y="642" text-anchor="middle" font-size="12.5" fill="#99523a">not valid until a human signs</text>
<line x1="372" y1="628" x2="496" y2="628" stroke="#6b7280" stroke-width="1.2" marker-end="url(#a)"/>
</g></svg>
