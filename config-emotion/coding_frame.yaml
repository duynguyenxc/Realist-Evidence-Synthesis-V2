# -----------------------------------------------------------------------------
# DESIGN TAGS — not part of the programme theory, but the review has to know how
# much of the pool could carry mechanism evidence at all.
# -----------------------------------------------------------------------------
study_designs:
  rct:              {label: Randomised controlled trial, terms: ["randomized controlled", "randomised controlled", "randomized trial",
                                                                 "randomised trial", "rct", "random assignment", "randomly assigned"]}
  quasi_experiment: {label: Quasi-experiment, terms: ["quasi-experiment", "quasi experimental", "pre-post", "pretest-posttest",
                                                      "control group", "comparison group", "intervention group"]}
  qualitative:      {label: Qualitative, terms: ["qualitative", "interview", "focus group", "thematic analysis",
                                                 "grounded theory", "case study", "phenomenolog"]}
  correlational:    {label: Correlational or cross-sectional, terms: ["cross-sectional", "correlational", "survey study",
                                                                     "questionnaire study", "structural equation", "path analysis"]}
  review:           {label: Review or synthesis, terms: ["systematic review", "meta-analysis", "meta analysis", "scoping review",
                                                         "realist review", "realist synthesis", "narrative review",
                                                         "umbrella review", "rapid review"]}
  longitudinal:     {label: Longitudinal, terms: ["longitudinal", "diary study", "experience sampling",
                                                  "ecological momentary", "repeated measures over"]}
