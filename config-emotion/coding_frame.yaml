            "sex difference", "international student", "mature student", "nontraditional",
            "non-traditional", "low-income", "prior achievement", "high-achieving",
            "low-achieving", "at-risk student", "gifted"]
  learning_situations:
    label: Learning situations
    named_by_professor: true
    terms: ["online learning", "remote learning", "blended", "hybrid", "laboratory",
            "lecture", "seminar", "clinical placement", "group work", "collaborative learning",
            "high-stakes exam", "examination period", "problem-based learning", "internship"]
  prior_experiences:
    label: Prior experiences
    named_by_professor: true
    terms: ["prior experience", "previous experience", "past failure", "prior failure",
            "previous achievement", "educational history", "prior knowledge",
            "earlier schooling", "adverse experience"]
  emotional_challenges:
    label: Emotional challenges
    named_by_professor: true
    terms: ["emotional challenge", "emotional difficult", "emotional distress",
            "emotion dysregulation", "emotional dysregulation", "alexithymia",
            "high anxiety", "fear of failure", "imposter", "impostor", "stereotype threat",
